inherit: ../default.yaml
name: diagnostic
description: Activation steering only (Qwen) — SteerVLM-style residual contrast.
benchmark:
  primitives: [rel_pos_horizontal, rel_pos_vertical, containment,
               list_ordinal, alignment, proximity, occlusion]
interventions:
  baseline:    {enabled: false}
  cot:         {enabled: false}
  set_of_mark: {enabled: false}
  steering:
    enabled: true
    layers: [12, 13, 14, 15, 16, 17, 18, 19]
    alpha: 4.0
    n_contrast: 200
models:
  - configs/models/qwen2_5_vl_7b.yaml
