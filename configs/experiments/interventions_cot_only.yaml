inherit: ../default.yaml
name: diagnostic                       # write into the same runs/diagnostic/<model>/ dir
description: CoT-only intervention vs baseline (paired evaluation).
benchmark:
  primitives: [rel_pos_horizontal, rel_pos_vertical, containment,
               list_ordinal, alignment, proximity, occlusion]
interventions:
  baseline:    {enabled: true}      # iv_baseline.jsonl pre-copied from diagnostic
  cot:         {enabled: true}
  set_of_mark: {enabled: false}
  steering:    {enabled: false}
models:
  - configs/models/qwen2_5_vl_7b.yaml
